[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-drawer"
dynamic = ["version"]
description = "Consolidate scattered backups into one organized archive."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "CC BY-NC 4.0" }
dependencies = ["Pillow"]

[dependency-groups]
dev = ["ruff", "pytest", "mypy"]

[tool.hatch.version]
path = "memory_drawer/__init__.py"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
